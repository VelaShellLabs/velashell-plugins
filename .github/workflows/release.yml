# 第一方插件的发布流水线:在 GitHub 页面**发布 Release** 时自动触发。
#
# 产出全部挂到该 Release 上,共用标签里的那个版本号:
#
#   velashell-plugins-<版本>.zip  主程序安装包里 plugins/ 那一层的一比一布局。
#                                 VelaShell 主仓库发版时按 pin 的版本下载它、解进发布目录
#                                 (见主仓库 Directory.Build.props 的 VelaPluginsBundleVersion)。
#   *.vpx                         每个插件一份,**已签名**,供用户手工安装 / 推进插件商店。
#   SHA256SUMS.txt                以上全部的校验和。
#
# 本仓库**不推 nuget.org**:插件的分发形态是 .vpx 与随应用分发的 plugins/ 目录,
# 不是 NuGet 包。要发 SDK 包请去工具链仓库 joesdu/velashell-plugin-toolchain。
#
# 🔑 需要的仓库机密(只此一个):
#   KEY_PEM_FILE   .vpx 签名私钥(P-256 PKCS#8 PEM)的 base64。缺了它发布**直接失败** ——
#                  未签名的 .vpx 与签过的看起来一模一样,不能让它悄悄发出去。
#                  怎么生成这个 base64 见 README 的"发布"一节。
#
#   注意它与**强名称密钥**(工具链仓库的 STRONG_NAME_KEY)是两回事:那把钥匙签的是 SDK
#   契约程序集(宿主已签名,不能引用未签名程序集),本仓库不产出程序集包,不参与那条约束。
#
# 📌 版本号不用手工改:标签解析出来之后,流水线**第一件事**就是跑
#    scripts/Set-Version.ps1 把该版本写进 Directory.Build.props 与 README 版本横幅。
#    发布成功后由 sync-main 任务开一个 PR 把这些改动回写 main(等你手动合)。
#    所以发版只剩两步:合进 main → 在 GitHub 上发 Release,标签填 v<版本>。
#
# ⚠️ 单个插件的版本在各自的 plugin.json 里,本流水线**不碰**。要发新版 Redis,
#    改 plugins/VelaShell.Plugin.Redis/plugin.json 的 version 并合进 main,
#    下一次 Release 出的 velashell.redis-*.vpx 自然就是新版本号。
name: Release

on:
  release:
    types: [published]
  # 手动兜底:release 事件没能触发时,在 Actions 页面选本工作流 → Run workflow → 填标签即可补跑。
  # 资产上传用 `gh release upload --clobber`,对同一标签重复跑是幂等的。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 Release 标签(如 v1.4.0)'
        required: true
        type: string
      dryRun:
        description: '只构建与打包,不上传 Release 资产'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    # 供 sync-main 回写时复用,免得把标签解析逻辑抄第二遍。
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name || inputs.tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) { Write-Error "No release tag available."; exit 1 }
          $version = $tag.TrimStart('v')
          # 打错标签(比如 "release-2")的话,资产文件名会变成一个谁也想不到的样子,
          # 而主仓库是按 velashell-plugins-<版本>.zip 这个确定名字去取的。
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Release tag '$tag' does not resolve to a SemVer version (got '$version'). Use e.g. v1.4.0 or v1.4.0-preview.1."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing version $version (tag $tag)"

      # 把标签里的版本号写进仓库,**放在构建之前** —— 产物因此永远与 Release 标签一致,
      # 与仓库里当时提交了什么无关。改动会在发布成功后由 sync-main 以 PR 形式回写 main。
      - name: Stamp version into the repo
        shell: pwsh
        run: |
          & ./scripts/Set-Version.ps1 '${{ steps.version.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git --no-pager diff --stat

      - name: Test
        shell: pwsh
        run: |
          dotnet test VelaShell.Plugins.slnx -c Debug --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ── 签名密钥 ────────────────────────────────────────────────────────────
      # .vpx 的签名密钥(P-256,vela-plugin keygen 生成的 PKCS#8 PEM)。仓库机密
      # KEY_PEM_FILE 里存的是这份 PEM 的 base64,这里还原成文件。
      #
      # 为什么必须签:.vpx 是用户手工安装、以及插件商店分发的形态 —— 没有签名,
      # "这个包确实来自我们"就无从谈起,宿主与商店都只能当匿名包处理。
      # 所以缺密钥时**直接失败**,而不是悄悄出一批未签名的包挂到 Release 上:
      # 那种包看起来和签过的一模一样,等发现时它已经在用户机器上了。
      #
      # 密钥落在工作区根目录,.gitignore 里 *.pem 已排除;末尾有一步 always() 删掉它。
      - name: Restore signing key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEY_PEM_B64)) {
            Write-Error "KEY_PEM_FILE secret is missing. The .vpx packages must be signed; add the base64 of your P-256 PEM private key as the KEY_PEM_FILE repository secret."
            exit 1
          }
          [IO.File]::WriteAllBytes("$PWD/velashell-signing.pem", [Convert]::FromBase64String($env:KEY_PEM_B64))
          # 只确认它确实是一份 PEM 私钥 —— 不打印任何内容。
          $head = (Get-Content velashell-signing.pem -TotalCount 1)
          if ($head -notmatch 'BEGIN .*PRIVATE KEY') {
            Write-Error "KEY_PEM_FILE did not decode to a PEM private key (first line: '$head'). Re-encode the .pem file itself, not its path or a text fragment."
            exit 1
          }
          Write-Host "Signing key restored."
        env:
          KEY_PEM_B64: ${{ secrets.KEY_PEM_FILE }}

      # 插件是纯托管、无 RID 的构建产物(EnableDynamicLoading,按 deps.json 由插件 ALC 解析),
      # 所以一个包吃遍五个平台,不必按 RID 分。
      - name: Build release assets
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          dotnet build build/PluginBundle.proj -c Release -t:Bundle -p:BundleDir="$PWD/artifacts/plugins-bundle" --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path artifacts/plugins-bundle/* -DestinationPath "artifacts/release/velashell-plugins-$version.zip" -Force
          # -p:VelaSigningKey 会经 MSBuild 的全局属性继承传到每个插件工程的 PackVpx 目标,
          # 由随 SDK 包分发的 vela-plugin 在打包时签名(见 PluginBundle.proj 的 PackAllVpx)。
          dotnet build build/PluginBundle.proj -c Release -t:PackAllVpx -p:VpxDir="$PWD/artifacts/vpx" -p:VelaSigningKey="$PWD/velashell-signing.pem" --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item artifacts/vpx/*.vpx artifacts/release/
          Get-ChildItem artifacts/release | Select-Object Name, Length

      # 共享程序集绝不能落进插件目录 —— 落了就说明 SDK 包的 exclude=Runtime 链路断了,
      # 而这种包发出去之后,现象是用户机器上的控件类型转换失败,离根因非常远。
      - name: Assert no shared assemblies leaked
        shell: pwsh
        run: |
          $leaked = Get-ChildItem artifacts/plugins-bundle -Recurse -Filter '*.dll' |
            Where-Object { $_.Name -like 'Avalonia*' -or $_.Name -eq 'VelaShell.PluginSdk.dll' }
          if ($leaked) {
            throw "Shared assemblies leaked into the plugin bundle: $(($leaked | ForEach-Object FullName) -join ', ')"
          }
          Write-Host "OK: no shared assemblies in the bundle."

      # 签名核对。不是形式,是有具体失败模式要拦:
      #
      # 密钥**路径**写错会响亮失败(vela-plugin 报 "Key file not found",MSBuild 跟着红),
      # 那条不需要这一步。真正危险的是**属性名**对不上 —— 比如哪天有人把
      # -p:VelaSigningKey 敲成别的名字,或者 PluginBundle.proj 的 PackAllVpx 不再把它
      # 转发下去:MSBuild 会把不认识的全局属性照单全收,构建 0 错误通过,
      # 产出的却是 `flags Masked` / `signature Unsigned` 的包 —— 与签过的包在文件名、
      # 大小、构建日志上都看不出区别(2026-08-22 实测确认过这条路)。
      #
      # 所以这里逐个把包读回来,确认 flags 里确实有 Signed 且签名自洽 —— 挂上 Release
      # 之前是最后一道能拦住它的地方。顺带把公钥指纹打进日志:插件商店登记用的就是它。
      - name: Verify every .vpx is signed
        shell: pwsh
        run: |
          $sdk = [regex]::Match((Get-Content -Raw Directory.Build.props), '<VelaSdkVersion[^>]*>([^<]+)</VelaSdkVersion>').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($sdk)) { throw "Could not read VelaSdkVersion from Directory.Build.props" }
          # 打包器随 VelaShell.PluginSdk.Build 包分发,上一步刚还原过,直接从包缓存里取,
          # 免得为了读一次包再装一个全局工具(版本还可能与打包用的那份不一致)。
          $cli = Join-Path $env:USERPROFILE ".nuget/packages/velashell.pluginsdk.build/$sdk/tools/net11.0/VelaShell.Plugin.Cli.dll"
          if (-not (Test-Path $cli)) { throw "vela-plugin not found at $cli" }

          $packages = @(Get-ChildItem artifacts/release/*.vpx)
          if ($packages.Count -eq 0) { throw "No .vpx found in artifacts/release." }
          foreach ($package in $packages) {
            $info = dotnet $cli info $package.FullName 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "vela-plugin info failed for $($package.Name):`n$info" }
            if ($info -notmatch 'flags\s+.*Signed') { throw "$($package.Name) is NOT signed:`n$info" }
            if ($info -notmatch 'signature\s+Valid') { throw "$($package.Name) has an invalid signature:`n$info" }
            $fingerprint = [regex]::Match($info, 'signature\s+Valid \((SHA256:[0-9a-f]+)\)').Groups[1].Value
            Write-Host "$($package.Name)  signed  $fingerprint"
          }

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          Push-Location artifacts/release
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Sort-Object | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-release-assets
          path: artifacts/release/*
          if-no-files-found: error

      # 主仓库按固定地址取 zip:releases/download/<tag>/velashell-plugins-<版本>.zip
      - name: Upload assets to release
        if: ${{ !inputs.dryRun }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem artifacts/release -File | ForEach-Object FullName
          gh release upload '${{ steps.version.outputs.tag }}' @assets --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit 1 }
        env:
          GH_TOKEN: ${{ github.token }}

      # 密钥不该在 runner 上多留一秒。always():上面任何一步失败也要删 ——
      # 失败路径恰恰是最容易把中间产物连同它一起打包上传的路径。
      - name: Remove signing key
        if: always()
        shell: pwsh
        run: Remove-Item velashell-signing.pem -Force -ErrorAction SilentlyContinue

  # ── 把版本号回写 main(以 PR 的形式)────────────────────────────────────────
  # 上面那个 Stamp 步骤只改了 runner 上的工作区 —— 资产已经挂上去了,但仓库里的
  # Directory.Build.props 与 README 版本横幅还停在上一版。不回写的话,下一个克隆仓库
  # 的人看到的版本号是错的,而且 CI 的 `Set-Version.ps1 -Check` 会一直红着。
  #
  # **开 PR 而不是直推 main**:main 迟早要开分支保护,直推那条路会被挡死。
  # 分支名 chore/version-<版本> 是确定的,所以手动补跑同一个标签会更新同一个 PR,
  # 不会攒出一堆。
  #
  # 单独一个 job 而不是接在 publish 后面:publish 的工作区检出在**标签**上、
  # 且已被构建产物弄脏,在那里 checkout main 会把两者搅在一起。这里从干净的
  # main 重新跑一遍脚本,结果与 publish 里那次逐字节相同(脚本是纯函数)。
  sync-main:
    needs: publish
    if: ${{ !inputs.dryRun }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # VERSION_SYNC_TOKEN 是**可选**的:没配就用 github.token,一切照常,唯一区别是
      # GITHUB_TOKEN 开出来的 PR **不会触发 CI**(GitHub 防工作流自循环的既定行为)。
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.VERSION_SYNC_TOKEN || github.token }}

      - name: Open version-sync PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VERSION_SYNC_TOKEN || github.token }}
        run: |
          $version = '${{ needs.publish.outputs.version }}'
          $branch = "chore/version-$version"

          & ./scripts/Set-Version.ps1 $version
          if ($LASTEXITCODE -ne 0) { exit 1 }

          if (-not (git status --porcelain)) {
            Write-Host "::notice::main 里的版本号已经是 $version,无需回写。"
            exit 0
          }

          # 回写失败不该让一次已经成功的发布显示成红的 —— 资产在 Release 上,已经是既成事实。
          # 这里整段降级成警告,把手工补救的命令给出来。
          #
          # try/catch 与 $LASTEXITCODE 两道都要:GitHub 给 pwsh 步骤预置了
          # $ErrorActionPreference='stop',而 PowerShell 7.4 起
          # $PSNativeCommandUseErrorActionPreference 默认为 true —— 原生命令返回非零会
          # **抛异常**,只写 if ($LASTEXITCODE) 的话根本走不到。
          try {
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git checkout -b $branch
            git commit -am "chore: 版本号同步到 $version"
            # --force:分支名由版本号决定,补跑时内容是从干净 main 重新生成的,
            # 强推等于"把这个 PR 刷新到最新",不存在要保留的历史。
            git push --force origin $branch
            if ($LASTEXITCODE -ne 0) { throw "推送 $branch 失败。" }

            # `// empty` 不是装饰:没有匹配的 PR 时 `.[0].url` 求值为 null,而 jq 会把它
            # 原样打成字符串 "null" —— 在 PowerShell 里那是**真值**,会让下面误判成"PR 已存在"。
            $existing = gh pr list --head $branch --state open --json url --jq '.[0].url // empty'
            if ($existing) {
              Write-Host "::notice::版本同步 PR 已存在,已刷新到最新:$existing"
              exit 0
            }

            # 不用 here-string:YAML 块标量里每行都带缩进,而 PowerShell 要求 @" 的
            # 结束符顶格,两者不可调和。用数组拼。
            $body = @(
              "本次发布(``$version``)的版本号回写。由 ``.github/workflows/release.yml`` 的 sync-main 任务生成。"
              ""
              "内容是 ``pwsh scripts/Set-Version.ps1 $version`` 的输出 —— 纯版本号替换,不含任何其它改动。"
              "同一份改动已经在发布流水线里构建、测试、打包全过一遍了(资产也已经挂上 Release)。"
              ""
              "**合掉它**,否则 CI 的版本同步体检(``Set-Version.ps1 -Check``)会一直红着,"
              "而且下一个克隆仓库的人看到的版本号是错的。"
            ) -join "`n"

            $url = gh pr create --base main --head $branch --title "chore: 版本号同步到 $version" --body $body
            if ($LASTEXITCODE -ne 0) { throw "gh pr create 失败。" }
            Write-Host "::notice::已开出版本同步 PR:$url"
          } catch {
            Write-Host $_.Exception.Message
            Write-Host "::warning::版本号回写 PR 没能开出来。发布本身已成功;请在本地跑 ``pwsh scripts/Set-Version.ps1 $version`` 后自行提 PR 合进 main,否则 CI 的版本同步体检会一直失败。"
            exit 0
          }
